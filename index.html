<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ask Book - V7.4</title>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* --- ESTILOS GERAIS --- */
        body { 
            background-color: #d2b48c; 
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png"); 
            margin: 0; 
            font-family: 'Patrick Hand', cursive; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        .screen { display: none; width: 100%; min-height: 100vh; justify-content: center; align-items: center; flex-direction: column; padding-bottom: 50px; box-sizing: border-box; }
        
        #screen-loading { display: flex; font-family: 'Gloria Hallelujah'; color: white; font-size: 24px; text-shadow: 2px 2px 0 #333; }

        /* Login */
        .login-card { background-color: #ffadad; width: 300px; padding: 40px; border-radius: 10px 20px 20px 10px; box-shadow: 10px 10px 20px rgba(0,0,0,0.3); text-align: center; border-left: 15px solid #d81b60; }
        .login-title { font-family: 'Gloria Hallelujah', cursive; font-size: 35px; color: #fff; text-shadow: 2px 2px 0 #d81b60; margin-bottom: 30px; }
        .btn-google { background-color: #fff; color: #444; display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: sans-serif; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-google:hover { transform: scale(1.05); }

        /* Sidebar (DESIGN ATUALIZADO) */
        .sidebar { position: fixed; left: -320px; top: 0; width: 300px; height: 100%; background: #2c2c2c; color: white; transition: 0.3s; z-index: 2000; box-shadow: 5px 0 15px rgba(0,0,0,0.5); padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .sidebar.open { left: 0; }
        .sidebar-title { font-family: 'Gloria Hallelujah'; font-size: 24px; border-bottom: 1px dashed #555; padding-bottom: 10px; margin-bottom: 20px; }
        
        .add-friend-box { display: flex; gap: 5px; margin-bottom: 20px; }
        .input-friend { flex: 1; padding: 8px; border-radius: 4px; border: none; font-family: sans-serif; }
        .btn-add-friend { background: #d81b60; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .friend-list { list-style: none; padding: 0; overflow-y: auto; flex: 1; margin-bottom: 20px; }
        .friend-item { padding: 12px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .friend-actions { display: flex; gap: 10px; }
        
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 18px; transition: transform 0.2s; }
        .btn-icon:hover { transform: scale(1.2); }
        
        /* NOVO RODAPÉ DE USUÁRIO (PERFIL) */
        .sidebar-footer {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #d81b60;
        }
        .btn-logout {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }
        .btn-logout:hover { background-color: #ff1744; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .overlay.visible { display: block; }

        /* Header */
        .feed-container { width: 90%; max-width: 800px; text-align: center; padding: 20px; }
        .feed-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 30px; }
        .header-center { display: flex; flex-direction: column; align-items: center; }
        .main-logo { font-family: 'Gloria Hallelujah'; font-size: 45px; color: #d81b60; text-shadow: 3px 3px 0 #fff; line-height: 1; margin: 0; }
        .sub-logo { font-family: 'Patrick Hand'; font-size: 22px; color: #fff; text-shadow: 1px 1px 2px #333; margin-top: 5px; opacity: 0.9; }
        .btn-menu { font-size: 35px; background: none; border: none; cursor: pointer; color: white; text-shadow: 2px 2px 0 #333; padding: 0; }
        .btn-create-main { background-color: #fff; color: #d81b60; border: 2px dashed #d81b60; padding: 10px 25px; font-family: 'Gloria Hallelujah'; font-size: 20px; border-radius: 50px; cursor: pointer; margin-bottom: 30px; box-shadow: 4px 4px 0px rgba(216, 27, 96, 0.2); transition: 0.2s; }
        
        /* Grid */
        .friends-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 30px; justify-items: center; }
        .friend-book { width: 140px; height: 180px; border-radius: 5px 15px 15px 5px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.3s; border-left: 10px solid rgba(0,0,0,0.2); position: relative; }
        .friend-book:hover { transform: translateY(-10px) rotate(2deg); }
        .book-label { background: white; color: #333; padding: 5px 10px; transform: rotate(-5deg); font-family: 'Gloria Hallelujah', cursive; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); font-size: 14px; max-width: 90%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; }
        .btn-delete-book { position: absolute; top: 5px; right: 5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* Cores */
        .bg-blue { background-color: #42a5f5; color: white; }
        .bg-purple { background-color: #ab47bc; color: white; }
        .bg-pink { background-color: #f06292; color: white; }
        .bg-orange { background-color: #ff9800; color: white; }
        .bg-teal { background-color: #009688; color: white; }
        .bg-black { background-color: #212121; color: white; border: 1px solid #000; }
        .bg-white { background-color: #ffffff; color: #333; border: 1px solid #ccc; }
        .bg-brown { background-color: #8B4513; color: white; border: 1px solid #5e2f0d; }
        .friend-book.bg-white { border-left: 10px solid rgba(0,0,0,0.2); }
        .friend-book.bg-brown { border-left: 10px solid rgba(0,0,0,0.2); }

        /* UI Papel */
        .paper { 
            width: 90%; max-width: 600px; min-height: 700px; 
            background-color: #fcfaf2; 
            position: relative; 
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); 
            border-radius: 2px; 
            margin: 20px 0; 
            padding: 40px 40px 40px 85px; 
            background-image: linear-gradient(90deg, transparent 79px, #ffadad 79px, #ffadad 81px, transparent 81px), 
                              linear-gradient(#fcfaf2 39px, #81c784 40px); 
            background-size: 100% 100%, 100% 40px; 
            background-attachment: local; 
        }
        
        #titulo-caderno {
            font-size: 32px;
            color: #333;
            margin: 0 0 40px 0; 
            padding-top: 5px;   
            line-height: 40px;  
        }

        .question-list { list-style: none; padding: 0; margin: 0; }
        .question-item { margin-bottom: 0; }
        
        .number-marker { 
            position: absolute; left: 13px; 
            color: #4fc3f7; font-weight: bold; font-family: 'Gloria Hallelujah'; font-size: 20px; 
            line-height: 40px; 
        }
        
        .question-text { 
            font-size: 24px; color: #333; 
            line-height: 40px; display: block; 
            margin: 0; padding: 0; height: 40px;
        }

        .friend-answer-line {
            font-size: 22px; line-height: 40px; height: 40px;
            display: flex; align-items: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .answer-input, .create-input { 
            width: 100%; height: 40px; 
            background: transparent; border: none; outline: none; 
            font-family: 'Patrick Hand'; font-size: 24px; line-height: 40px; 
            margin: 0; padding: 0; display: block; 
            color: #003366; vertical-align: bottom;
        }
        .create-input { border-bottom: 2px dashed #d81b60; color: #d81b60; }
        
        .color-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .color-circle { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .color-circle.bg-white { border: 1px solid #ccc; } 
        .color-circle:hover, .color-circle.selected { transform: scale(1.2); border-color: #333; }

        /* CHAT */
        .chat-modal { position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: none; flex-direction: column; z-index: 2500; border: 1px solid #ccc; }
        .chat-header { background: #d81b60; color: white; padding: 10px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; font-family: 'Gloria Hallelujah'; }
        .chat-body { flex: 1; padding: 10px; overflow-y: auto; background: #fcfaf2; display: flex; flex-direction: column; gap: 5px; }
        .chat-footer { padding: 5px; border-top: 1px solid #ccc; display: flex; }
        .chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-msg { padding: 5px 10px; border-radius: 10px; max-width: 80%; font-size: 14px; word-wrap: break-word; }
        .msg-me { background: #d81b60; color: white; align-self: flex-end; }
        .msg-friend { background: #e0e0e0; color: #333; align-self: flex-start; }

        .btn-back { position: fixed; top: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background-color: #d81b60; color: white; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 1000; }
        
        .pen-tool { 
            position: absolute; top: 20px; right: 25px; z-index: 10; 
            cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pen-icon { 
            font-size: 40px; 
            filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.3)); 
            transform: rotate(15deg); 
            display: block; 
            transition: transform 0.2s; 
        }
        .pen-tool:hover .pen-icon {
            transform: rotate(0deg) scale(1.15) translateY(-5px); 
        }
        .color-input-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="fecharMenus()"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-title">Amigos 🤝</div>
        <div class="add-friend-box">
            <input type="email" id="input-friend-email" class="input-friend" placeholder="email@amigo.com">
            <button class="btn-add-friend" onclick="adicionarAmigo()">Add</button>
        </div>
        <ul id="lista-amigos-sidebar" class="friend-list"></ul>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <img id="user-img" class="user-avatar" src="">
                <div style="display:flex; flex-direction:column;">
                    <span id="user-name" style="font-size: 16px; font-weight: bold;">...</span>
                    <span style="font-size: 12px; color: #aaa;">Online</span>
                </div>
            </div>
            <button class="btn-logout" onclick="fazerLogout()">Sair / Trocar Conta</button>
        </div>
    </div>

    <div id="chat-modal" class="chat-modal">
        <div class="chat-header">
            <span id="chat-friend-name">Chat</span>
            <button onclick="fecharChat()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <div id="chat-body" class="chat-body"></div>
        <div class="chat-footer">
            <input type="text" id="chat-input" class="chat-input" placeholder="Digite..." onkeypress="if(event.key==='Enter') enviarMensagemChat()">
            <button onclick="enviarMensagemChat()" style="background:none; border:none; font-size:20px; cursor:pointer;">🚀</button>
        </div>
    </div>

    <div id="screen-loading" class="screen" style="display: flex;">
        <p>Verificando acesso...</p>
    </div>

    <div id="screen-login" class="screen">
        <div class="login-card">
            <div class="login-title">My Ask Book 🔒</div>
            <p style="color: white;">Versão 7.4</p>
            <button class="btn-google" onclick="fazerLoginGoogle()">
                <span style="color: #4285F4">G</span> Entrar com Google
            </button>
        </div>
    </div>

    <div id="screen-feed" class="screen">
        <div class="feed-container">
            <div class="feed-header">
                <button class="btn-menu" onclick="toggleMenu()">☰</button>
                <div class="header-center">
                    <h1 class="main-logo">My Ask Book</h1>
                    <div class="sub-logo">Cadernos</div>
                </div>
                <div style="width: 35px;"></div>
            </div>

            <button class="btn-create-main" onclick="verificarSeJaTemCaderno()">+ Criar meu Caderno</button>
            <div id="loading" style="color: white;">Carregando...</div>
            <div class="friends-grid" id="grid-cadernos"></div>
        </div>
    </div>

    <div id="screen-notebook" class="screen">
        <div class="btn-back" onclick="navegarPara('screen-feed')">&#8617;</div>
        <div class="paper">
            <div class="pen-tool">
                <span class="pen-icon">✏️</span>
                <input type="color" id="colorPickerResposta" class="color-input-hidden" value="#003366">
            </div>
            <h1 id="titulo-caderno">Caderno...</h1>
            <ul class="question-list" id="lista-perguntas-leitura"></ul>
        </div>
    </div>

    <div id="screen-create" class="screen">
        <div class="btn-back" onclick="navegarPara('screen-feed')">&#8617;</div>
        <div class="paper">
            <div class="pen-tool">
                <span class="pen-icon">✏️</span>
                <input type="color" id="colorPickerCriacao" class="color-input-hidden" value="#d81b60">
            </div>
            <h1 style="border-bottom: 2px dashed #ccc;">Novo Caderno ✎</h1>
            
            <div style="text-align: center; margin-bottom: 10px;">
                <label style="color:#777; font-size:14px;">Como seus amigos te veem:</label><br>
                <input type="text" id="input-meu-nome" style="border:1px solid #ccc; padding:5px; border-radius:5px; font-family:'Patrick Hand'; width: 200px; text-align:center;">
            </div>

            <div class="color-options">
                <div class="color-circle bg-blue selected" onclick="selecionarCorCapa('bg-blue', this)"></div>
                <div class="color-circle bg-purple" onclick="selecionarCorCapa('bg-purple', this)"></div>
                <div class="color-circle bg-pink" onclick="selecionarCorCapa('bg-pink', this)"></div>
                <div class="color-circle bg-orange" onclick="selecionarCorCapa('bg-orange', this)"></div>
                <div class="color-circle bg-teal" onclick="selecionarCorCapa('bg-teal', this)"></div>
                <div class="color-circle bg-black" onclick="selecionarCorCapa('bg-black', this)"></div>
                <div class="color-circle bg-white" onclick="selecionarCorCapa('bg-white', this)"></div>
                <div class="color-circle bg-brown" onclick="selecionarCorCapa('bg-brown', this)"></div>
            </div>
            <input type="hidden" id="input-cor-capa" value="bg-blue">
            <ul class="question-list" id="lista-criacao"></ul>
            <button onclick="adicionarNovaLinha()" style="margin: 20px auto; display:block;">+ Nova Pergunta</button>
            <button onclick="salvarNovoCadernoNoBanco()" style="margin: 10px auto; display:block; background: #66bb6a; color: white; border: none; padding: 10px 30px; border-radius: 20px; cursor: pointer; font-family: 'Patrick Hand'; font-size: 20px;">💾 Publicar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAgcjqoOBIlgdHyhaZLvyPS4kn_wDlt65s",
          authDomain: "my-ask-book.firebaseapp.com",
          projectId: "my-ask-book",
          storageBucket: "my-ask-book.firebasestorage.app",
          messagingSenderId: "49716420840",
          appId: "1:49716420840:web:aed419b89144f3f020e95d",
          measurementId: "G-X0J2BW2HWY"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let usuarioAtual = null;
        let meusAmigos = [];
        let chatAtualId = null;
        let unsubscribeChat = null;
        let mapaNomesAmigos = {}; 

        auth.onAuthStateChanged(user => {
            if (user) {
                usuarioAtual = user;
                carregarMeusAmigosDoBanco();
                atualizarUIUsuario();
                navegarPara('screen-feed');
            } else {
                navegarPara('screen-login');
            }
        });

        function fazerLoginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => alert("Erro: " + error.message));
        }

        function fazerLogout() {
            auth.signOut().then(() => {
                window.location.reload();
            });
        }

        function atualizarUIUsuario() {
            if (usuarioAtual) {
                document.getElementById('user-name').innerText = usuarioAtual.displayName.split(' ')[0];
                document.getElementById('user-img').src = usuarioAtual.photoURL;
            }
        }

        function carregarMeusAmigosDoBanco() {
            db.collection('usuarios').doc(usuarioAtual.uid).get().then(doc => {
                if (doc.exists && doc.data().amigos) meusAmigos = doc.data().amigos;
                carregarFeed(); 
            });
        }
        function adicionarAmigo() {
            const input = document.getElementById('input-friend-email');
            const email = input.value.trim().toLowerCase();
            if (!email || meusAmigos.includes(email) || email === usuarioAtual.email) return;
            meusAmigos.push(email);
            db.collection('usuarios').doc(usuarioAtual.uid).set({ amigos: meusAmigos, email: usuarioAtual.email }, { merge: true });
            carregarFeed();
            input.value = "";
        }
        function removerAmigo(email) {
            meusAmigos = meusAmigos.filter(e => e !== email);
            db.collection('usuarios').doc(usuarioAtual.uid).set({ amigos: meusAmigos, email: usuarioAtual.email }, { merge: true });
            carregarFeed();
        }
        
        function renderizarListaAmigos() {
            const ul = document.getElementById('lista-amigos-sidebar');
            ul.innerHTML = "";
            meusAmigos.forEach(email => {
                const nomeExibicao = mapaNomesAmigos[email] || email;
                ul.innerHTML += `
                    <li class="friend-item">
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-size:18px; font-weight:bold;">${nomeExibicao}</span>
                            ${nomeExibicao !== email ? `<span style="font-size:14px; color:#aaa">${email}</span>` : ''}
                        </div>
                        <div class="friend-actions">
                            <button class="btn-icon" onclick="abrirChat('${email}', '${nomeExibicao}')">💬</button>
                            <button class="btn-icon" style="color:#ff5252" onclick="removerAmigo('${email}')">🗑️</button>
                        </div>
                    </li>`;
            });
        }

        function abrirChat(emailAmigo, nomeAmigo) {
            const emails = [usuarioAtual.email, emailAmigo].sort();
            chatAtualId = emails[0].replace(/\./g, '_') + "-" + emails[1].replace(/\./g, '_');
            document.getElementById('chat-modal').style.display = 'flex';
            document.getElementById('chat-friend-name').innerText = nomeAmigo;
            toggleMenu(); 
            const chatBody = document.getElementById('chat-body');
            chatBody.innerHTML = "<p style='text-align:center; color:#999'>Carregando...</p>";
            if (unsubscribeChat) unsubscribeChat();
            unsubscribeChat = db.collection('chats').doc(chatAtualId).collection('mensagens').orderBy('data', 'asc').onSnapshot(snapshot => {
                chatBody.innerHTML = "";
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = `chat-msg ${msg.email === usuarioAtual.email ? 'msg-me' : 'msg-friend'}`;
                    div.innerText = msg.texto;
                    chatBody.appendChild(div);
                });
                chatBody.scrollTop = chatBody.scrollHeight;
            });
        }
        function enviarMensagemChat() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto || !chatAtualId) return;
            db.collection('chats').doc(chatAtualId).collection('mensagens').add({
                texto: texto, email: usuarioAtual.email, data: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = "";
        }
        function fecharChat() {
            document.getElementById('chat-modal').style.display = 'none';
            if (unsubscribeChat) unsubscribeChat();
        }

        function carregarFeed() {
            const grid = document.getElementById('grid-cadernos');
            const loading = document.getElementById('loading');
            db.collection('cadernos').onSnapshot((snapshot) => {
                loading.style.display = 'none';
                grid.innerHTML = "";
                mapaNomesAmigos = {}; 

                const tutorialDiv = document.createElement('div');
                tutorialDiv.className = "friend-book bg-orange";
                tutorialDiv.innerHTML = `<div class="book-label">Como Usar?</div><div style="position:absolute; bottom:10px; font-size:12px; color:white;">Clique Aqui!</div>`;
                tutorialDiv.onclick = abrirTutorial;
                grid.appendChild(tutorialDiv);

                snapshot.forEach((doc) => {
                    const dados = doc.data();
                    const id = doc.id;
                    if (!dados.donoNome) return;
                    mapaNomesAmigos[dados.donoEmail] = dados.donoNome;
                    const ehMeu = (dados.donoEmail === usuarioAtual.email);
                    const ehAmigo = meusAmigos.includes(dados.donoEmail);

                    if (ehMeu || ehAmigo) {
                        const div = document.createElement('div');
                        div.className = `friend-book ${dados.corCapa || 'bg-blue'}`;
                        div.onclick = (e) => {
                            if (e.target.className.includes('btn-delete-book')) return;
                            abrirCadernoParaResponder(id, dados);
                        };
                        let htmlConteudo = `<div class="book-label">${dados.donoNome}</div>`;
                        if (ehMeu) htmlConteudo += `<button class="btn-delete-book" onclick="excluirCaderno('${id}')">🗑️</button>`;
                        div.innerHTML = htmlConteudo;
                        grid.appendChild(div);
                    }
                });
                renderizarListaAmigos();
            });
        }

        function abrirTutorial() {
            const dadosFake = {
                donoNome: "Tutorial",
                perguntas: [
                    "Bem-vindo ao My Ask Book!",
                    "Você irá descobrir diversas curiosidades sobre seus amigos.",
                    "Crie o seu caderno e comece a interagir.",
                    "Adicione amigos no menu lateral e converse com eles em tempo real.",
                    "Não esqueça de responder os cadernos de seus amigos, entre na brincadeira!"
                ]
            };
            abrirCadernoParaResponder("tutorial", dadosFake);
        }

        function excluirCaderno(id) {
            if (confirm("Apagar seu caderno?")) db.collection('cadernos').doc(id).delete();
        }

        let idCadernoAberto = null;

        function verificarSeJaTemCaderno() {
            if (!usuarioAtual) return;
            navegarPara('screen-create');
            document.getElementById('input-meu-nome').value = usuarioAtual.displayName;
            const pickerCriacao = document.getElementById('colorPickerCriacao');
            pickerCriacao.addEventListener('input', () => { document.querySelectorAll('.create-input').forEach(inp => inp.style.color = pickerCriacao.value); });
            const lista = document.getElementById('lista-criacao');
            if (lista.children.length === 0) {
                adicionarNovaLinha("Qual seu nome?");
                adicionarNovaLinha("Uma música que te lembra de mim?");
            }
        }
        function adicionarNovaLinha(textoPadrao = "") {
            const lista = document.getElementById('lista-criacao');
            const num = lista.children.length + 1;
            const li = document.createElement('li');
            li.className = 'question-item';
            li.innerHTML = `
                <div style="height: 40px;"></div>
                <span class="number-marker">${num < 10 ? '0'+num : num}.</span>
                <input type="text" class="create-input" value="${textoPadrao}" style="color:${document.getElementById('colorPickerCriacao').value}" placeholder="Sua pergunta aqui...">
            `;
            lista.appendChild(li);
        }
        function salvarNovoCadernoNoBanco() {
            const inputs = document.querySelectorAll('.create-input');
            const cor = document.getElementById('input-cor-capa').value;
            const novoNome = document.getElementById('input-meu-nome').value || usuarioAtual.displayName;
            const perguntas = [];
            inputs.forEach(input => { if (input.value.trim()) perguntas.push(input.value); });
            if (!perguntas.length) return alert("Crie uma pergunta!");
            db.collection('cadernos').doc(usuarioAtual.uid).set({
                donoNome: novoNome, donoEmail: usuarioAtual.email, corCapa: cor, perguntas: perguntas, dataCriacao: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { alert("Publicado!"); navegarPara('screen-feed'); });
        }
        function selecionarCorCapa(classe, el) {
            document.getElementById('input-cor-capa').value = classe;
            document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function abrirCadernoParaResponder(idCaderno, dadosCaderno) {
            idCadernoAberto = idCaderno;
            navegarPara('screen-notebook');
            document.getElementById('titulo-caderno').innerText = "Caderno de " + dadosCaderno.donoNome;
            
            if (idCaderno === 'tutorial') {
                document.querySelector('.pen-tool').style.display = 'none';
            } else {
                document.querySelector('.pen-tool').style.display = 'block';
            }
            
            const lista = document.getElementById('lista-perguntas-leitura');
            lista.innerHTML = "<p style='text-align:center'>Carregando respostas...</p>";

            if (idCaderno === 'tutorial') {
                renderizarPerguntasERespostas(dadosCaderno, []);
                return;
            }

            db.collection('cadernos').doc(idCaderno).collection('respostas').get().then(snapshot => {
                let todasRespostas = [];
                snapshot.forEach(doc => {
                    todasRespostas.push({ uid: doc.id, dados: doc.data() });
                });
                renderizarPerguntasERespostas(dadosCaderno, todasRespostas);
            });
        }

        function renderizarPerguntasERespostas(dadosCaderno, todasRespostas) {
            const lista = document.getElementById('lista-perguntas-leitura');
            lista.innerHTML = "";

            dadosCaderno.perguntas.forEach((pergunta, index) => {
                const num = index + 1;
                const perguntaID = `resp_${index}`;
                
                const liPergunta = document.createElement('li');
                liPergunta.className = 'question-item';
                liPergunta.innerHTML = `
                    <div style="height: 40px;"></div>
                    <span class="number-marker">${num < 10 ? '0'+num : num}.</span>
                    <span class="question-text">${pergunta}</span>
                `;
                lista.appendChild(liPergunta);

                todasRespostas.forEach(registro => {
                    if (registro.uid !== usuarioAtual.uid && registro.dados[perguntaID]) {
                        const resp = registro.dados[perguntaID];
                        const liAmigo = document.createElement('li');
                        liAmigo.className = 'question-item';
                        const nomeAmigo = registro.dados.nomeQuemRespondeu || "Anônimo";
                        liAmigo.innerHTML = `
                            <div class="friend-answer-line" style="color:${resp.cor || '#333'}">
                                <strong style="color:#555; margin-right:5px; font-size:14px;">${nomeAmigo}:</strong> ${resp.texto}
                            </div>
                        `;
                        lista.appendChild(liAmigo);
                    }
                });

                if (idCadernoAberto !== 'tutorial') {
                    const liMeuInput = document.createElement('li');
                    liMeuInput.className = 'question-item';
                    let meuTexto = "";
                    let minhaCor = document.getElementById('colorPickerResposta').value;
                    const minhaRespostaSalva = todasRespostas.find(r => r.uid === usuarioAtual.uid);
                    if (minhaRespostaSalva && minhaRespostaSalva.dados[perguntaID]) {
                        meuTexto = minhaRespostaSalva.dados[perguntaID].texto;
                        minhaCor = minhaRespostaSalva.dados[perguntaID].cor;
                    }
                    liMeuInput.innerHTML = `
                        <input type="text" class="answer-input" id="${perguntaID}" 
                               value="${meuTexto}" style="color:${minhaCor}" 
                               placeholder="Sua resposta..." oninput="salvarResposta(this)">
                    `;
                    lista.appendChild(liMeuInput);
                }
            });
        }

        function salvarResposta(input) {
            if (!usuarioAtual || idCadernoAberto === 'tutorial') return;
            const picker = document.getElementById('colorPickerResposta');
            const dados = {};
            const corFinal = input.style.color || picker.value;
            dados[input.id] = { texto: input.value, cor: corFinal };
            dados.nomeQuemRespondeu = document.getElementById('input-meu-nome').value || usuarioAtual.displayName;
            db.collection('cadernos').doc(idCadernoAberto).collection('respostas').doc(usuarioAtual.uid).set(dados, { merge: true });
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('visible');
        }
        function fecharMenus() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('visible');
        }
        function navegarPara(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }
    </script>
</body>
</html>
